<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ZD Config Transfer</title>
    <!--
      ZAF SDK v2 — provided by the Zendesk app runtime. The src must point
      at the version the manifest declares (frameworkVersion=2.0).
    -->
    <script src="https://static.zdassets.com/zendesk_app_framework_sdk/2.0/zaf_sdk.min.js"></script>
    <style>
      html, body, #root { margin: 0; padding: 0; height: 100%; }
      body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    </style>
    <script>
      // Apply saved theme before paint to prevent flash of wrong theme.
      (function () {
        try {
          var t = localStorage.getItem("zd-theme");
          if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
          document.documentElement.setAttribute("data-theme", t);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
